
<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RUSH – Dagens armbånd</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #08090d;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
}

#screen {
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    padding: 30px 40px 20px;
    display: flex;
    flex-direction: column;
    position: relative;
    isolation: isolate;
    background: #090b12 center/cover no-repeat;
}

#screen::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    background:
        linear-gradient(90deg,#04060c88,#04060c33),
        linear-gradient(0deg,#04060c66,#04060c22);
}

/* TOPP */

header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
}

.rush-logo {
    font-size: 100px !important;
    font-weight: 900;
    letter-spacing: 5px;
}

.clockblock {
    text-align: right;
}

.clockblock .clock {
    font-size: clamp(110px, 9vw, 180px) !important;
    font-weight: 900 !important;
    line-height: 1.05 !important;
    font-variant-numeric: tabular-nums;
}

.clockblock .date {
    font-size: clamp(38px, 3vw, 60px) !important;
    font-weight: 800 !important;
    margin-top: 10px;
    color: white;
}

/* VELKOMSTTEKST */

.welcome {
    text-align: center;
    font-size: clamp(90px, 8vw, 160px) !important;
    font-weight: 900 !important;
    line-height: 1.05;
    white-space: nowrap;
    margin: 25px 0 15px !important;
    text-shadow: 0 5px 18px #000c;
}

/* UNDERTITTEL */

.subhead {
    text-align: center;
    font-size: 48px !important;
    font-weight: 900;
    letter-spacing: 5px;
    margin: 0 0 25px;
    color: white;
}

/* ARMBÅNDSBOKSER */

.cards {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 25px;
    width: 100%;
    flex: 1;
    min-height: 0;
    align-items: stretch;
}

.card {
    min-width: 0;
    padding: 35px;
    border-radius: 22px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    box-shadow: 0 12px 35px #0008;
    border: 2px solid #ffffff55;
    overflow: hidden;
}

.card .name {
    font-size: 75px !important;
    font-weight: 900;
}

.card .status {
    font-size: 34px !important;
    font-weight: 900;
    letter-spacing: 3px;
    margin-bottom: 18px;
}

.card .remaining {
    font-size: 100px !important;
    font-weight: 900;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
}

.card .detail {
    font-size: 34px !important;
    font-weight: 800;
    margin-top: 18px;
}

/* FARGER */

.pink {
    background: #ed168f;
    color: white;
}

.red {
    background: #ed3030;
    color: white;
}

.silver {
    background: #c0c0c0;
    color: #191919;
}

.green {
    background: #22b95c;
    color: #101010;
}

.orange {
    background: #ff8c20;
    color: #191919;
}

.blue {
    background: #1688ff;
    color: white;
}

.yellow {
    background: #ffe333;
    color: #191919;
}

.purple {
    background: #a64dff;
    color: white;
}

.black {
    background: #242424;
    color: white;
}

.white {
    background: #f1f1f1;
    color: #191919;
}

.done {
    background: #202127f2;
    color: white;
    border: 3px solid #ffffff99;
}

/* BUNNTEKST */

footer {
    text-align: center;
    padding-top: 18px;
    font-size: 28px !important;
    font-weight: 900;
    letter-spacing: 7px;
    color: white;
    flex-shrink: 0;
}
</style>
</head>

<body>

<main id="screen">

    <header>
        <div class="rush-logo">RUSH</div>

        <div class="clockblock">
            <div class="clock" id="clock">00:00:00</div>
            <div class="date" id="date"></div>
        </div>
    </header>

    <h1 class="welcome">VELKOMMEN TIL OSS!</h1>

    <p class="subhead">DAGENS ARMBÅND</p>

    <section class="cards" id="cards"></section>

    <footer>RUSH TRAMPOLINEPARK</footer>

</main>

<script>

const colors = [
    {name:"ROSA",cls:"pink"},
    {name:"RØD",cls:"red"},
    {name:"SØLV",cls:"silver"},
    {name:"GRØNN",cls:"green"},
    {name:"ORANSJE",cls:"orange"},
    {name:"BLÅ",cls:"blue"},
    {name:"GUL",cls:"yellow"},
    {name:"LILLA",cls:"purple"},
    {name:"SVART",cls:"black"},
    {name:"HVIT",cls:"white"}
];

const firstFinish = 630;
const step = 30;

const screen = document.getElementById("screen");

function parts(n) {
    return Object.fromEntries(
        new Intl.DateTimeFormat("en-GB", {
            timeZone: "Europe/Oslo",
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
            hourCycle: "h23"
        }).formatToParts(n).map(x => [x.type, x.value])
    );
}

function weekday(n) {
    return new Intl.DateTimeFormat("en-US", {
        timeZone: "Europe/Oslo",
        weekday: "short"
    }).format(n);
}

function fmt(s) {
    s = Math.max(0, Math.floor(s));

    let h = Math.floor(s / 3600);
    let m = Math.floor(s % 3600 / 60);
    let q = s % 60;

    return h
        ? `${h}t ${String(m).padStart(2,"0")}m`
        : `${String(m).padStart(2,"0")}:${String(q).padStart(2,"0")}`;
}

function render() {

    const now = new Date();
    const p = parts(now);
    const minute = +p.hour * 60 + +p.minute;
    const wd = weekday(now);

    /* KLOKKE */

    document.getElementById("clock").textContent =
        `${p.hour}:${p.minute}:${p.second}`;

    /* DATO */

    document.getElementById("date").textContent =
        new Intl.DateTimeFormat("nb-NO", {
            timeZone: "Europe/Oslo",
            weekday: "long",
            day: "numeric",
            month: "long"
        }).format(now);

    /* BAKGRUNNSBILDER */

    if ((wd === "Sat" || wd === "Sun") &&
        minute >= 510 && minute < 660) {

        screen.style.backgroundImage =
        "url('https://raw.githubusercontent.com/Joachim-dev-bit/rush-wristband-display/main/Rush-helg.jpg')";

    } else if (["Mon","Tue","Wed","Thu","Fri"].includes(wd)) {

        screen.style.backgroundImage =
        "url('https://raw.githubusercontent.com/Joachim-dev-bit/rush-wristband-display/main/Rush-ukedag.jpg')";

    } else {

        screen.style.backgroundImage = "none";
    }

    /* BEREGNING */

    const k = Math.floor((minute - firstFinish) / step);

    let upcoming = [];
    let last = null;
    let finished = false;

    if (minute < firstFinish) {

        for (let i = 0; i < 4; i++) {

            upcoming.push({
                i,
                finish: firstFinish + i * step,
                seconds:
                    (firstFinish + i * step - minute) * 60 - (+p.second)
            });
        }

    } else {

        finished =
            (((minute - firstFinish) - k * step) * 60 + (+p.second)) < 120;

        last = ((k % colors.length) + colors.length) % colors.length;

        for (
            let i = k + 1;
            i < k + 1 + (finished ? 3 : 4);
            i++
        ) {

            upcoming.push({
                i,
                finish: firstFinish + i * step,
                seconds:
                    (firstFinish + i * step - minute) * 60 - (+p.second)
            });
        }
    }

    /* VIS BOKSER */

    const cards = document.getElementById("cards");
    cards.innerHTML = "";

    if (finished && last !== null) {

        const d = colors[last];
        const el = document.createElement("article");

        el.className = "card done";

        el.innerHTML = `
            <div class="name">${d.name}</div>
            <div>
                <div class="status">STATUS</div>
                <div class="remaining">FERDIG</div>
                <div class="detail">Ferdigtid passert</div>
            </div>
        `;

        cards.appendChild(el);
    }

    upcoming.forEach(it => {

        const c = colors[
            ((it.i % colors.length) + colors.length) % colors.length
        ];

        const end = ((it.finish % 1440) + 1440) % 1440;

        const t =
            `${String(Math.floor(end / 60)).padStart(2,"0")}:` +
            `${String(end % 60).padStart(2,"0")}`;

        const el = document.createElement("article");

        el.className = `card ${c.cls}`;

        el.innerHTML = `
            <div class="name">${c.name}</div>
            <div>
                <div class="status">FERDIG OM</div>
                <div class="remaining">${fmt(it.seconds)}</div>
                <div class="detail">Ferdig kl. ${t}</div>
            </div>
        `;

        cards.appendChild(el);
    });
}

render();
setInterval(render, 1000);

</script>

</body>
</html>
