<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rush – 4 farger bortover</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08090d;color:#fff;font-family:Arial,Helvetica,sans-serif}
#screen{height:100vh;height:100dvh;padding:2vh 2vw;display:flex;flex-direction:column;position:relative;isolation:isolate;background:#090b12 center/cover no-repeat}
#screen:before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,#04060c66,#04060c33),linear-gradient(0deg,#04060c55,#04060c22)}
header{display:flex;align-items:center;justify-content:space-between;flex-shrink:0}.logo{width:clamp(100px,12vw,180px);max-height:8vh;object-fit:contain}.clockblock{text-align:right}.clock{font-size:clamp(24px,3vw,44px);font-weight:800;font-variant-numeric:tabular-nums}.date{font-size:clamp(12px,1.2vw,18px);margin-top:5px;color:#e0e5ef}
.welcome{text-align:center;font-size:clamp(25px,3.3vw,52px);margin:1.5vh 0 .8vh;font-weight:900;text-shadow:0 2px 10px #000b}.subhead{text-align:center;font-size:clamp(13px,1.25vw,20px);font-weight:700;margin:0 0 2vh;color:#e0e5ef}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(8px,1.3vw,24px);width:100%;margin:auto;align-items:stretch}
.card{min-width:0;height:clamp(230px,47vh,510px);padding:clamp(14px,1.8vw,32px);border-radius:16px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 10px 28px #0006;border:1px solid #ffffff44;overflow:hidden}
.name{font-size:clamp(17px,2.05vw,35px);font-weight:900}.status{font-size:clamp(10px,1.1vw,18px);font-weight:900;letter-spacing:.08em;margin-bottom:12px}.remaining{font-size:clamp(19px,2.8vw,51px);font-weight:900;white-space:nowrap;font-variant-numeric:tabular-nums}.detail{font-size:clamp(10px,1vw,17px);font-weight:700;margin-top:12px}
.pink{background:#ed168f;color:white}.red{background:#ed3030;color:white}.silver{background:#c0c0c0;color:#191919}.green{background:#22b95c;color:#101010}.orange{background:#ff8c20;color:#191919}.blue{background:#1688ff;color:white}.yellow{background:#ffe333;color:#191919}.purple{background:#a64dff;color:white}.black{background:#242424;color:white}.white{background:#f1f1f1;color:#191919}.done{background:#202127f2;color:white;border:2px solid #ffffff88}
footer{text-align:center;padding-top:1vh;font-size:clamp(10px,1vw,15px);font-weight:900;letter-spacing:.16em;color:#e0e5ef}
@media(max-width:700px){.cards{gap:6px}.card{height:42vh;padding:9px;border-radius:9px}.name{font-size:clamp(12px,2.7vw,20px)}.status{font-size:clamp(8px,1.5vw,12px);margin-bottom:6px}.remaining{font-size:clamp(13px,3vw,23px)}.detail{font-size:clamp(8px,1.5vw,12px);margin-top:6px}.welcome{font-size:clamp(20px,4vw,32px)}}
@media(max-height:520px){#screen{padding:7px 12px}.logo{max-height:6vh}.welcome{margin:5px}.subhead{margin:0 0 5px}.card{height:55vh;padding:10px}footer{padding-top:3px}}
</style></head><body><main id="screen"><header><div style="font-size:clamp(25px,3vw,44px);font-weight:900;letter-spacing:.04em">RUSH</div><div class="clockblock"><div class="clock" id="clock">00:00:00</div><div class="date" id="date"></div></div></header><h1 class="welcome">VELKOMMEN TIL OSS!</h1><p class="subhead">DAGENS ARMBÅND</p><section class="cards" id="cards"></section><footer>RUSH TRAMPOLINEPARK</footer></main>
<script>
const colors=[{name:"ROSA",cls:"pink"},{name:"RØD",cls:"red"},{name:"SØLV",cls:"silver"},{name:"GRØNN",cls:"green"},{name:"ORANSJE",cls:"orange"},{name:"BLÅ",cls:"blue"},{name:"GUL",cls:"yellow"},{name:"LILLA",cls:"purple"},{name:"SVART",cls:"black"},{name:"HVIT",cls:"white"}];
const firstFinish=630,step=30,screen=document.getElementById("screen");
function parts(n){return Object.fromEntries(new Intl.DateTimeFormat("en-GB",{timeZone:"Europe/Oslo",hour:"2-digit",minute:"2-digit",second:"2-digit",hourCycle:"h23"}).formatToParts(n).map(x=>[x.type,x.value]))}
function weekday(n){return new Intl.DateTimeFormat("en-US",{timeZone:"Europe/Oslo",weekday:"short"}).format(n)}
function fmt(s){s=Math.max(0,Math.floor(s));let h=Math.floor(s/3600),m=Math.floor(s%3600/60),q=s%60;return h?`${h}t ${String(m).padStart(2,"0")}m`:`${String(m).padStart(2,"0")}:${String(q).padStart(2,"0")}`}
function render(){const now=new Date(),p=parts(now),minute=+p.hour*60 + +p.minute,wd=weekday(now);document.getElementById("clock").textContent=`${p.hour}:${p.minute}:${p.second}`;document.getElementById("date").textContent=new Intl.DateTimeFormat("nb-NO",{timeZone:"Europe/Oslo",weekday:"long",day:"numeric",month:"long"}).format(now);
if((wd==="Sat"||wd==="Sun")&&minute>=510&&minute<660)screen.style.backgroundImage="url('https://raw.githubusercontent.com/Joachim-dev-bit/rush-wristband-display/main/Rush-helg.jpg')";else if(["Mon","Tue","Wed","Thu","Fri"].includes(wd))screen.style.backgroundImage="url('https://raw.githubusercontent.com/Joachim-dev-bit/rush-wristband-display/main/Rush-ukedag.jpg')";else screen.style.backgroundImage="none";
const k=Math.floor((minute-firstFinish)/step);let upcoming=[],last=null,finished=false;if(minute<firstFinish){for(let i=0;i<4;i++)upcoming.push({i,finish:firstFinish+i*step,seconds:(firstFinish+i*step-minute)*60-(+p.second)})}else{finished=(((minute-firstFinish)-k*step)*60+(+p.second))<120;last=((k%colors.length)+colors.length)%colors.length;for(let i=k+1;i<k+1+(finished?3:4);i++)upcoming.push({i,finish:firstFinish+i*step,seconds:(firstFinish+i*step-minute)*60-(+p.second)})}
const cards=document.getElementById("cards");cards.innerHTML="";if(finished&&last!==null){const d=colors[last],el=document.createElement("article");el.className="card done";el.innerHTML=`<div class="name">${d.name}</div><div><div class="status">STATUS</div><div class="remaining">FERDIG</div><div class="detail">Ferdigtid passert</div></div>`;cards.appendChild(el)}
upcoming.forEach(it=>{const c=colors[((it.i%colors.length)+colors.length)%colors.length],end=((it.finish%1440)+1440)%1440,t=`${String(Math.floor(end/60)).padStart(2,"0")}:${String(end%60).padStart(2,"0")}`,el=document.createElement("article");el.className=`card ${c.cls}`;el.innerHTML=`<div class="name">${c.name}</div><div><div class="status">FERDIG OM</div><div class="remaining">${fmt(it.seconds)}</div><div class="detail">Ferdig kl. ${t}</div></div>`;cards.appendChild(el)})}
render();setInterval(render,1000);
</script></body></html>
